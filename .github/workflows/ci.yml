# CI — static checks + the full test suite on every push and pull request.
# actionlint catches YAML/expression mistakes before they can break a
# release build; npm test runs the pure-Node suite (no network) so
# regressions surface here, not on a release tag.
name: ci

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read
  # setup-node dependency caching writes to the Actions cache.
  actions: write

jobs:
  workflow-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Lint GitHub Actions workflows
        uses: raven-actions/actionlint@v2

  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run the pure-Node test suite
        run: npm test