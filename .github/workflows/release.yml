# Release CI — builds installers on every v* tag push (or on demand via
# workflow_dispatch) and opens a draft GitHub release with all artifacts
# attached. Publish the draft from the Releases page when ready.
name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: torrentor-windows
          - os: macos-latest
            artifact: torrentor-macos
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build installers
        run: npm run dist

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist-exe/*
          if-no-files-found: error

  # Tags only: collect both platforms' artifacts into one draft release.
  # Manual runs (workflow_dispatch) skip this step — grab the artifacts
  # from the run page instead.
  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    steps:
      # gh release create needs a git repo to resolve owner/repo and the tag.
      - name: Check out
        uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: torrentor-*
          merge-multiple: true
          path: artifacts

      - name: Open draft release with installers
        env:
          GH_TOKEN: ${{ github.token }}
        # Only the archives (exe/dmg/zip) — dist-exe also contains the
        # unpacked app dirs (win-unpacked, mac), which are not assets.
        run: gh release create "${{ github.ref_name }}" artifacts/*.{exe,dmg,zip} --draft --title "${{ github.ref_name }}" --generate-notes