# Release CI — builds installers on every v* tag push (or on demand via
# workflow_dispatch) and opens a draft GitHub release with all artifacts
# attached. Publish the draft from the Releases page when ready.
name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  # contents: create the release + attach assets; actions: upload/download
  # build artifacts between jobs (v4 artifact actions authenticate on this scope)
  contents: write
  actions: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: torrentor-windows
          - os: macos-latest
            artifact: torrentor-macos
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build installers
        run: npm run dist

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          # Only the installer archives — dist-exe also holds the unpacked
          # app dirs (win-unpacked, mac-universal) and blockmaps, which are
          # not assets. (No brace globs: @actions/glob runs with nobrace.)
          path: |
            dist-exe/*.exe
            dist-exe/*.dmg
            dist-exe/*.zip
          if-no-files-found: error

  # Tags only: collect both platforms' artifacts into one draft release.
  # Manual runs (workflow_dispatch) skip this step — grab the artifacts
  # from the run page instead.
  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    steps:
      # gh release create needs a git repo to resolve owner/repo AND the
      # actual tag ref — a shallow checkout leaves the tag unfetched and
      # gh would create an untagged draft release.
      - name: Check out (full history so the tag ref resolves)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: torrentor-*
          merge-multiple: true
          path: artifacts

      - name: Open draft release with installers
        env:
          GH_TOKEN: ${{ github.token }}
        # Belt-and-braces: the upload step already ships only archives,
        # but this glob also guards against stray files in the artifact.
        # (bash, not @actions/glob, so brace expansion is fine here.)
        run: gh release create "${{ github.ref_name }}" artifacts/*.{exe,dmg,zip} --draft --title "${{ github.ref_name }}" --generate-notes